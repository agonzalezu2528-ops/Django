# render.yaml — Blueprint de Render (alcance W12: web Docker + PostgreSQL)
# Documentación: https://render.com/docs/blueprint-spec
#
# Fuera de alcance hasta su semana (no tienen código todavía):
#   W13+  Stripe / SendGrid (variables de entorno)
#   W16+  Redis, Celery worker/beat, Flower
#         Nota: Render NO tiene plan gratuito para background workers.

services:
  - type: web
    name: erp-django-utec            # debe coincidir con el servicio en Render
    runtime: docker                 # imagen con Pango/Cairo para WeasyPrint
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /              # pública; responde sin login
    # El ENTRYPOINT del Dockerfile migra, recolecta estáticos y arranca
    # Gunicorn en 0.0.0.0:$PORT, así que no hace falta startCommand.
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings_prod
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: erp-django-db
          property: connectionString
      # Media en S3 (W11, opcional). Sin bucket se usa el disco efímero.
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      # W16: Celery + Redis (Key Value de Render)
      - key: REDIS_URL               # Internal Key Value URL (redis://red-...:6379)
        sync: false
      - key: CELERY_EMBEDDED_WORKER  # 1 = worker dentro del contenedor web
        value: "1"
      # W18: Celery Beat embebido (tareas programadas). UNA sola instancia.
      - key: CELERY_EMBEDDED_BEAT    # 1 = worker arranca con --beat
        value: "1"
      - key: REPORTE_DIARIO_HORA     # HH:MM hora de México (crontab)
        value: "08:00"
      # W17: correo transaccional con SendGrid  (después de CELERY_EMBEDDED_WORKER)
      - key: SENDGRID_API_KEY        # SG.xxxx (permiso Mail Send)
        sync: false
      - key: DEFAULT_FROM_EMAIL      # ERP Django <sender-verificado@...>
        sync: false
      - key: ADMIN_EMAIL             # recibe alertas de stock y errores 500
        sync: false

databases:
  - name: erp-django-db
    plan: free
    region: oregon
    databaseName: erp_db
    user: erp_user